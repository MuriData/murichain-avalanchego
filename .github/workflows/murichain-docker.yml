name: MuriChain Docker Image

on:
  push:
    branches:
      - murichain
    tags:
      - "murichain-v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.25.8"

jobs:
  # Lowercase the owner name for Docker image references (Docker requires lowercase)
  prepare:
    name: Prepare image names
    runs-on: ubuntu-latest
    outputs:
      avalanchego-image: ghcr.io/${{ steps.lower.outputs.owner }}/murichain-avalanchego
      subnet-evm-image: ghcr.io/${{ steps.lower.outputs.owner }}/murichain-subnet-evm
    steps:
      - name: Lowercase owner
        id: lower
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  build-avalanchego:
    name: Build avalanchego base image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.avalanchego-image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=murichain-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push avalanchego image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            AVALANCHEGO_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-subnet-evm:
    name: Build subnet-evm plugin image
    runs-on: ubuntu-latest
    needs: [prepare, build-avalanchego]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.subnet-evm-image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=murichain-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push subnet-evm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./graft/subnet-evm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            AVALANCHEGO_NODE_IMAGE=${{ needs.prepare.outputs.avalanchego-image }}:${{ needs.build-avalanchego.outputs.image-tag }}
            SUBNET_EVM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-precompiles:
    name: Test custom precompiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run precompile tests
        run: go test ./graft/subnet-evm/precompile/contracts/groth16verifier/ -v -timeout 2m
