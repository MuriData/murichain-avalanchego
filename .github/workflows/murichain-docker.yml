name: MuriChain Docker Image

on:
  push:
    branches:
      - murichain
    tags:
      - "murichain-v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Images are published under the repo owner's namespace
  AVALANCHEGO_IMAGE: ghcr.io/${{ github.repository_owner }}/murichain-avalanchego
  SUBNET_EVM_IMAGE: ghcr.io/${{ github.repository_owner }}/murichain-subnet-evm
  GO_VERSION: "1.25.8"

jobs:
  build-avalanchego:
    name: Build avalanchego base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AVALANCHEGO_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=murichain-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push avalanchego image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            AVALANCHEGO_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-subnet-evm:
    name: Build subnet-evm plugin image
    runs-on: ubuntu-latest
    needs: build-avalanchego
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SUBNET_EVM_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=murichain-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push subnet-evm image
        env:
          BASE_IMAGE_TAG: ${{ needs.build-avalanchego.outputs.image-tag }}
        run: |
          echo "Using base image tag: ${BASE_IMAGE_TAG}"

      - name: Build and push subnet-evm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./graft/subnet-evm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            AVALANCHEGO_NODE_IMAGE=${{ env.AVALANCHEGO_IMAGE }}:${{ needs.build-avalanchego.outputs.image-tag }}
            SUBNET_EVM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-precompiles:
    name: Test custom precompiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run precompile tests
        run: go test ./graft/subnet-evm/precompile/contracts/groth16verifier/ -v -timeout 2m
