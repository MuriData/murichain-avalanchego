name: MuriChain Build & Release

on:
  push:
    branches:
      - murichain
    tags:
      - "murichain-v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.25.8"

jobs:
  # ─── Preparation ────────────────────────────────────────────────────
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      avalanchego-image: ghcr.io/${{ steps.lower.outputs.owner }}/murichain-avalanchego
      subnet-evm-image: ghcr.io/${{ steps.lower.outputs.owner }}/murichain-subnet-evm
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}
    steps:
      - name: Lowercase owner
        id: lower
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/murichain-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/murichain-v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::8}"
            echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Tests ──────────────────────────────────────────────────────────
  test-precompiles:
    name: Test custom precompiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run precompile tests
        run: |
          go test ./graft/subnet-evm/precompile/contracts/groth16verifier/ -v -timeout 2m
          go test ./graft/subnet-evm/precompile/contracts/poseidon2hasher/ -v -timeout 2m
          go test ./graft/subnet-evm/precompile/contracts/poseidon2smt/ -v -timeout 2m

  # ─── Binary Builds ─────────────────────────────────────────────────
  build-binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [prepare, test-precompiles]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cross-compiler (linux/arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build avalanchego
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-O2 -D__BLST_PORTABLE__"
        run: |
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi

          COMMIT="${GITHUB_SHA::8}"
          go build \
            -ldflags "-X github.com/ava-labs/avalanchego/version.GitCommit=$COMMIT" \
            -o build/avalanchego \
            ./main

      - name: Build subnet-evm plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-O2 -D__BLST_PORTABLE__"
        run: |
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi

          COMMIT="${GITHUB_SHA::8}"
          go build \
            -ldflags "-X github.com/ava-labs/avalanchego/version.GitCommit=$COMMIT" \
            -o build/plugins/srEXiWaHuhNyGwPUi444Tu47ZEDwxTWrbQiuD7FmgSAQ6X7Dy \
            ./graft/subnet-evm/plugin/

      - name: Package tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_GOOS: ${{ matrix.goos }}
          BUILD_GOARCH: ${{ matrix.goarch }}
        run: |
          ARCHIVE="murichain-avalanchego-v${VERSION}-${BUILD_GOOS}-${BUILD_GOARCH}.tar.gz"
          tar -czf "${ARCHIVE}" -C build avalanchego plugins/
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: murichain-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 14

  # ─── Docker Images ─────────────────────────────────────────────────
  build-avalanchego-image:
    name: Build avalanchego Docker image
    runs-on: ubuntu-latest
    needs: [prepare, test-precompiles]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.avalanchego-image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=murichain-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push avalanchego image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            AVALANCHEGO_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-subnet-evm-image:
    name: Build subnet-evm Docker image
    runs-on: ubuntu-latest
    needs: [prepare, build-avalanchego-image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.subnet-evm-image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=murichain-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push subnet-evm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./graft/subnet-evm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            AVALANCHEGO_NODE_IMAGE=${{ needs.prepare.outputs.avalanchego-image }}:${{ needs.build-avalanchego-image.outputs.image-tag }}
            SUBNET_EVM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── GitHub Release (tags only) ────────────────────────────────────
  release:
    name: Create GitHub Release
    if: needs.prepare.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries, build-avalanchego-image, build-subnet-evm-image]
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum murichain-avalanchego-*.tar.gz > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MuriChain v${{ needs.prepare.outputs.version }}"
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            release-assets/murichain-avalanchego-*.tar.gz
            release-assets/SHA256SUMS.txt
          body: |
            ## MuriChain v${{ needs.prepare.outputs.version }}

            Based on AvalancheGo v1.14.1 with MuriChain custom precompiles:
            - Groth16 BN254 verifier (`0x0300000000000000000000000000000000000001`)
            - Poseidon2 sponge hash (`0x0300000000000000000000000000000000000002`)
            - Poseidon2 sparse Merkle tree (`0x0300000000000000000000000000000000000003`)

            ### Docker Images

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/murichain-avalanchego:${{ needs.prepare.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/murichain-subnet-evm:${{ needs.prepare.outputs.version }}
            ```

            Each tarball contains `avalanchego` and `plugins/srEXiWaHuhNyGwPUi444Tu47ZEDwxTWrbQiuD7FmgSAQ6X7Dy` (subnet-evm).
